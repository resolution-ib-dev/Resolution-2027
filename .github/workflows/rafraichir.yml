name: Rafraîchir le droit en vigueur

# Trois déclenchements : à la main, le 1er de chaque mois, et à toute
# modification de la liste des codes.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"
  push:
    paths:
      - "codes.json"
      - "extraire_legi.py"

permissions:
  contents: write

concurrency:
  group: droit
  cancel-in-progress: false

jobs:
  extraire:
    runs-on: ubuntu-latest
    # 120 suffisait à un seul balayage (~55-60 min). La résolution par
    # intitulé lit l'archive une seconde fois en entier avant le balayage
    # (~55-60 min de plus) : les deux passes combinées ont dépassé 120 min
    # et fait annuler le job (run #14, 20260904). Le calcul ne change pas
    # une fois les intitulés retirés de codes.json, seulement l'inverse.
    timeout-minutes: 210

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Faire de la place
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Extraire les codes de la base LEGI
        env:
          DATE_EXTRACTION: ${{ github.run_started_at }}
        run: python3 extraire_legi.py

      - name: Contrôle — l'extrait se relit
        run: |
          python3 droit.py etat
          python3 droit.py article "code général des impôts" 279 | head -20
          python3 droit.py article "code de la sécurité sociale" "L. 136-8" | head -12

      - name: Verser
        env:
          BRANCHE: ${{ github.ref_name }}
        run: |
          git config user.name  "action droit"
          git config user.email "action@users.noreply.github.com"
          git add -A data/
          # Se remettre à jour AVANT de pousser : un commit fait à la main
          # pendant les (désormais) une à deux heures d'extraction ferait
          # rejeter le push, et l'extrait serait produit puis jeté.
          #
          # Contre SA PROPRE branche, jamais contre main en dur : un run
          # déclenché sur une branche de travail (PR #2, 20260904) rebasait
          # contre main, dont l'historique diverge — conflit sur chaque
          # fichier touché par la PR, `|| true` l'avalait, et le commit final
          # échouait sur les fichiers restés en conflit, extrait perdu.
          git stash --include-untracked || true
          git pull --rebase --autostash origin "$BRANCHE" || true
          git stash pop || true
          git add -A data/
          if git diff --cached --quiet; then
            echo "aucun changement"
          else
            git commit -m "droit : millésime LEGI $(python3 -c "import json;print(json.load(open('data/_manifeste.json'))['millesime_legi'])")"
            git push
          fi

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          echo "--- data/_diagnostic.json ---"
          cat data/_diagnostic.json 2>/dev/null || echo "aucun diagnostic écrit"

      - name: Garder le diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic
          path: data/_diagnostic.json
          if-no-files-found: ignore
